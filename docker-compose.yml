services:
  auth:
    build: ./services/auth
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sarvantha
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
